[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "boardgame-ml"
version = "0.1.0"
description = "A modular reinforcement-learning framework for teaching agents to play board and card games."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "gymnasium>=0.29,<1.0",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "stable-baselines3>=2.3,<2.5",
    "sb3-contrib>=2.3,<2.5",
    "torch>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]
web = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
# Benchmark calibration (M10): LunarLander needs Box2D + pygame. The
# gymnasium[box2d] source build of box2d-py fails on this toolchain; the
# prebuilt `box2d` wheel (2.3.10) is the working install.
calibration = ["box2d>=2.3.10", "pygame>=2.5"]

[project.scripts]
boardgame-ml-web = "boardgame_ml.web.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
