[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "boardgame-ml"
version = "0.1.0"
description = "A modular reinforcement-learning framework for teaching agents to play board and card games."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "gymnasium>=0.29,<1.0",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "stable-baselines3>=2.3,<2.5",
    "sb3-contrib>=2.3,<2.5",
    "torch>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
